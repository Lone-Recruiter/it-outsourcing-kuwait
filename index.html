<!DOCTYPE html>
<html>
<head>
    <title>Available Positions</title>
</head>
<body>

<h1>Available Positions in Kuwait</h1>

<p>Select a position to view details and apply:</p>

<ul id="open-positions">
    <li>Loading...</li>
</ul>

<script src="website-visibility.js"></script>
<script>
Promise.all([
    fetch("positions.json", { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Positions could not be loaded.");
        return response.json();
    }),
    window.KBMRecruitmentWebsite.loadVisibility()
]).then(([positions, visibility]) => {
    const openList = document.getElementById("open-positions");
    openList.innerHTML = "";

    positions.filter(job => window.KBMRecruitmentWebsite.isVisible(job, visibility)).forEach(job => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = `job.html?id=${encodeURIComponent(job.id)}`;
        a.textContent = job.title;
        li.appendChild(a);
        openList.appendChild(li);
    });

    if (openList.children.length === 0) openList.innerHTML = "<li>No positions are currently open.</li>";
}).catch(error => {
    document.getElementById("open-positions").innerHTML = "<li>Position availability could not be checked right now. Please refresh the page shortly.</li>";
    console.error("Unable to verify recruitment website listings.", error);
});
</script>

</body>
</html>
