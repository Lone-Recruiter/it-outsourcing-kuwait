<!DOCTYPE html>
<html>
<head>
    <title>Available Positions</title>
</head>
<body>

<h1>Available Positions in Kuwait</h1>

<p>Select a position to view details and apply:</p>

<ul id="open-positions">
    <li>Loading...</li>
</ul>

<script>
fetch("positions.json")
.then(response => response.json())
.then(positions => {

    const openList = document.getElementById("open-positions");
    openList.innerHTML = "";

    positions.filter(job => job.active === true).forEach(job => {

        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = `job.html?id=${job.id}`;
        a.textContent = job.title;

        li.appendChild(a);
        openList.appendChild(li);
    });

    if (openList.children.length === 0) {
        openList.innerHTML = "<li>No positions are currently open.</li>";
    }

});
</script>

</body>
</html>
